name = "sonos-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Nicht-geheime Konfigurationswerte. SONOS_CLIENT_SECRET NICHT hier eintragen,
# sondern per "wrangler secret put SONOS_CLIENT_SECRET" setzen.
[vars]
SONOS_CLIENT_ID = "REPLACE_WITH_YOUR_SONOS_CLIENT_ID"

# Muss 1:1 der Worker-URL entsprechen, die du bei Sonos als Redirect-URI
# hinterlegst, z.B. https://sonos-relay.<dein-subdomain>.workers.dev/callback
REDIRECT_URI = "https://sonos-relay.<your-subdomain>.workers.dev/callback"

# Custom-URI-Scheme, das die Android-App per Intent-Filter abfängt
APP_CALLBACK_SCHEME = "sonoscontrol://callback"

# KV-Speicher für den Abgleich zwischen Tablets (/sync/…). Ohne ihn
# antworten diese Endpunkte mit 501; Login und Refresh laufen trotzdem.
# Anlegen mit "npx wrangler kv namespace create SYNC_KV" und die ausgegebene
# id hier eintragen, dann die drei Zeilen einkommentieren (siehe README).
# [[kv_namespaces]]
# binding = "SYNC_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
